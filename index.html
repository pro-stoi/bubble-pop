<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Пузырьки 🫧</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/menu.css" />
    
    <!-- ===== ПОДКЛЮЧАЕМ ЖИРНЫЙ ШРИФТ ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- ================================= -->
    
    <!-- ===== VK BRIDGE ===== -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <!-- =================== -->
</head>
<body>
    <canvas id="menuCanvas"></canvas>

    <!-- Заголовок -->
    <div class="menu-title">
        <h1>
            <span class="bubble-icon"></span>
            <span class="bubble-icon"></span>
            <span class="bubble-icon"></span>
        </h1>
        <h2>ПУЗЫРЬКИ</h2>
    </div>

    <!-- Кнопка "ИГРАТЬ" -->
    <div class="menu-btn play-btn" id="playBtn">
        <div class="bubble-btn" style="--hue: 200;">
            <span>▶</span>
            <span class="btn-label">ИГРАТЬ</span>
        </div>
    </div>

    <!-- Кнопка "ИСПЫТАНИЯ" -->
    <div class="menu-btn challenges-btn" id="challengesBtn">
        <div class="bubble-btn" style="--hue: 280;">
            <span>🏆</span>
            <span class="btn-label">ИСПЫТАНИЯ</span>
        </div>
    </div>

    <!-- Кнопка "ТОП" -->
    <div class="menu-btn top-btn" id="topBtn">
        <div class="bubble-btn" style="--hue: 45;">
            <span>🏆</span>
            <span class="btn-label">ТОП</span>
        </div>
    </div>

    <!-- Кнопка "ЗВУК" -->
    <div class="menu-btn sound-btn" id="soundBtn">
        <div class="bubble-btn" style="--hue: 320;">
            <span id="soundIcon">🔊</span>
            <span class="btn-label" id="soundLabel">ЗВУК</span>
        </div>
    </div>

    <!-- ===== НОВАЯ КНОПКА ВЫХОДА (ВНИЗУ) ===== -->
    <div class="menu-btn exit-btn" id="exitBtn" style="
        position: fixed;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        pointer-events: auto;
        cursor: pointer;
        touch-action: manipulation;
    ">
        <div class="bubble-btn" style="--hue: 0; width: 60px; height: 60px; background: radial-gradient(circle at 35% 35%, rgba(255,100,100,0.6), rgba(200,50,50,0.3));">
            <span>🚪</span>
            <span class="btn-label">ВЫХОД</span>
        </div>
    </div>
    <!-- ================================= -->
    <!-- ===== ССЫЛКА НА ПОЛИТИКУ КОНФИДЕНЦИАЛЬНОСТИ ===== -->
    <div style="position:fixed;bottom:4px;left:0;right:0;text-align:center;z-index:100;pointer-events:auto;">
        <a href="privacy.html" target="_blank" style="font-size:10px;color:rgba(255,255,255,0.25);text-decoration:underline;">
            Политика конфиденциальности
        </a>
    </div>
    <!-- ================================================== -->

    <!-- ===== АУДИО МЕНЕДЖЕР ===== -->
    <script src="js/audioManager.js"></script>
    <!-- ===== АУДИО ===== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="audio/menu.mp3" type="audio/mpeg">
    </audio>

    <script src="js/core/api.js"></script>
    <script src="js/core/dataMapper.js"></script>
    <script src="js/core/dataStore.js"></script>
    <script src="js/core/repository.js"></script>

    <script src="js/bubble.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/vk.js"></script>
    <script src="js/nav.js"></script>

    <script src="js/privacy.js"></script>

    <script src="js/menu.js"></script>

    <!-- ===== МОДАЛКА СОГЛАСИЯ НА ОБРАБОТКУ ДАННЫХ ===== -->
    <div id="privacyConsentModal" class="exit-modal" style="display:none;">
        <div class="exit-modal-content" style="max-width:400px;">
            <div class="exit-modal-title" style="font-size:20px;">🫧 Добро пожаловать!</div>
            <div style="padding:12px 0;color:rgba(255,255,255,0.7);font-size:14px;line-height:1.6;text-align:left;">
                Для работы игры мы сохраняем:
                <ul style="margin:8px 0 0 20px;color:rgba(255,255,255,0.6);font-size:13px;">
                    <li>Ваш VK ID</li>
                    <li>Имя из профиля</li>
                    <li>Игровую статистику</li>
                </ul>
            </div>
            <div style="padding:8px 0;color:rgba(255,255,255,0.5);font-size:12px;text-align:left;">
                Подробнее: <a href="privacy.html" target="_blank" style="color:#66ccff;">Политика конфиденциальности</a>
            </div>
            <div class="exit-modal-buttons" style="flex-direction:column;gap:10px;margin-top:12px;">
                <button class="exit-modal-btn exit-modal-btn-exit" id="privacyAcceptBtn" style="width:100%;padding:14px;font-size:15px;">
                    ✅ Согласен
                </button>
                <button class="exit-modal-btn exit-modal-btn-back" id="privacyDeclineBtn" style="width:100%;padding:12px;font-size:14px;">
                    ❌ Не согласен
                </button>
            </div>
        </div>
    </div>
    <!-- ================================================ -->

</body>
</html>
